<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/"><span class="brand-icon">🛡️</span><span class="brand-text">Cert<span>Verify</span></span></a>
    <nav class="links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Overview</a>
      <a routerLink="/issuer" routerLinkActive="active">Issuer Portal</a>
      <a routerLink="/verify" routerLinkActive="active">Verify</a>
    </nav>
    <div class="wallet-box">
      <span id="walletStatus" class="network-tag" [class.ok]="wallet.connected()">{{ wallet.connected() ? 'Connected' : 'Not connected' }}</span>
      <span id="networkTag" class="network-tag" [class.ok]="wallet.correctNetwork()" [class.bad]="wallet.wrongNetwork()">{{ wallet.networkLabel() || disconnectedLabel }}</span>
      <span id="walletAddress" class="wallet-address" [hidden]="!wallet.connected()">{{ wallet.shortAddress() }}</span>
      <button id="connectBtn" class="btn btn-ghost" style="padding: 0.375rem 0.75rem; font-family: var(--font-mono); font-size: 0.75rem;" [disabled]="wallet.busy()" (click)="wallet.toggle()">
        @if (wallet.busy()) { <span class="spinner"></span> Connecting… }
        @else { {{ wallet.connected() ? 'Disconnect' : verifying ? 'Connect wallet (optional)' : 'Connect MetaMask' }} }
      </button>
    </div>
  </div>
</header>
@if (wallet.error()) { <div class="container"><div class="banner show" role="alert">{{ wallet.error() }}</div></div> }
<router-outlet />
<footer class="site-footer">CertVerify · SHA-256 · Ganache Local · Solidity 0.8.20</footer>
